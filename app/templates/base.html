<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Étoile Ballet School{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Étoile <span>Ballet School</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav class="site-nav" id="siteNav">
        <ul>
          {% for link in nav_links %}
          <li><a href="{{ link.path }}" class="{{ 'active' if active == link.path else '' }}">{{ link.name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Étoile Ballet School. All rights reserved.</p>
    </div>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
