<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}T.PARADISE Ballet School{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">&#10022;</span> T.PARADISE <span>Ballet School</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav class="site-nav" id="siteNav">
        <ul>
          {% for link in nav_links %}
          <li><a href="{{ link.path }}" class="{{ 'active' if active == link.path else '' }}">{{ link.name }}</a></li>
          {% endfor %}
          {% if current_user %}
          <li class="nav-user">Hi, {{ current_user.name }}</li>
          <li>
            <form class="logout-form" method="post" action="/logout">
              <button type="submit" class="link-btn">Log Out</button>
            </form>
          </li>
          {% else %}
          <li><a href="/login" class="{{ 'active' if active == '/login' else '' }}">Log In</a></li>
          {% endif %}
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 T.PARADISE Ballet School. All rights reserved.</p>
    </div>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
