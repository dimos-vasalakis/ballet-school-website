{% extends "base.html" %}
{% block title %}Sign Up — Étoile Ballet School{% endblock %}
{% block content %}
<section class="section container">
  <h1>Create an Account</h1>

  {% if error %}
  <p class="error-message">{{ error }}</p>
  {% endif %}

  <form class="auth-form" method="post" action="/signup">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

    <button type="submit" class="btn">Sign Up</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
